name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sakasuru
          POSTGRES_PASSWORD: sakasuru
          POSTGRES_DB: sakasuru_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sakasuru" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sakasuru:sakasuru@localhost:5432/sakasuru_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true
