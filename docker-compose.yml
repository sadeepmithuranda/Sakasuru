# Local full stack: PostgreSQL + API (which also serves the web app).
#   docker compose up --build   →  http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sakasuru
      POSTGRES_PASSWORD: sakasuru
      POSTGRES_DB: sakasuru
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakasuru"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://sakasuru:sakasuru@db:5432/sakasuru
      JWT_SECRET: change-me-in-production-change-me-1234567890
      DATA_ENCRYPTION_KEY: change-me-in-production-32-characters-min
      CORS_ORIGINS: http://localhost:4000,http://localhost:5173
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["4000:4000"]
volumes:
  pgdata:
