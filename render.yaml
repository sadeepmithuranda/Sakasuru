# Render Blueprint — one web service (API + web app) and a managed PostgreSQL.
# Dashboard → New → Blueprint → select this repository.
databases:
  - name: sakasuru-db
    databaseName: sakasuru
    user: sakasuru
    plan: free

services:
  - type: web
    name: sakasuru
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && VITE_API_URL=/ pnpm build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sakasuru-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: WEB_DIST_DIR
        value: apps/web/dist
      - key: CORS_ORIGINS
        value: https://sakasuru.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
